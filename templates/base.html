<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hub World{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pixels.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-scene="{% block scene %}game{% endblock %}">
  <button id="mute-toggle" class="mute-toggle" type="button" aria-pressed="false">Sound: on</button>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/scenes.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
